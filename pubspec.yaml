name: womencare_sakhi
description: SheCare Sakhi - Safety, Health & Daily Guide for Women
publish_to: 'none'
version: 6.0.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.5
  geolocator: ^11.0.0
  youtube_player_flutter: ^9.0.1
  shared_preferences: ^2.2.2
  flutter_contacts: ^1.1.7
  image_picker: ^1.0.7
  flutter_local_notifications: ^17.0.0
  flutter_ringtone_player: ^4.0.0
  http: ^1.2.1
  csv: ^6.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - image_280732b5.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "image_280732b5.jpg"
  adaptive_icon_background: "#FCE4EC"
  adaptive_icon_foreground: "image_280732b5.jpg"
