name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create .
      - run: flutter pub get
      - run: sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle || true
      - run: dart run flutter_launcher_icons
      - run: sed -i 's/android:label="womencare_sakhi"/android:label="SheCare Sakhi"/g' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SheCare-Sakhi-V3
          path: build/app/outputs/flutter-apk/app-release.apk
