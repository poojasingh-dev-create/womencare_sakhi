name: Build SheCare Sakhi APK & PlayStore Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android Project Structure
        run: flutter create --platforms=android --org=com.pooja.shecaresakhi .

      - name: Configure Android Permissions & SDK
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <application/' $MANIFEST
          sed -i 's/android:label="[^"]*"/android:label="SheCare Sakhi"/' $MANIFEST

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Create Release Signing Key
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload -storepass sakhi123 -keypass sakhi123 \
            -dname "CN=Pooja Chouhan, OU=SheCareSakhi, O=SheCareSakhi, L=Vidisha, ST=MP, C=IN"

      - name: Build Signed APK (For Phone Testing)
        run: flutter build apk --release

      - name: Build Signed AAB (For Google Play Store)
        run: flutter build appbundle --release

      - name: Upload Both APK and PlayStore AAB
        uses: actions/upload-artifact@v4
        with:
          name: SheCare-Sakhi-APK-and-AAB
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            android/app/upload-keystore.jks
